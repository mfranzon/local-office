name: Release

# Push a tag (v0.3.0) to build the .dmg and the Windows installer and attach them to its GitHub release,
# or run it by hand to rebuild them for an existing tag. Linux: build from source (README).
# Pull requests that change the packaging build both without releasing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.2.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ github.event_name != 'pull_request' && (inputs.tag || github.ref_name) || '' }}   # '': the PR's code

jobs:
  dmg:
    runs-on: macos-14   # Apple Silicon; the app targets arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install ninja
      - run: packaging/build_app.sh   # ad-hoc signed; other Macs need "Open Anyway"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/LocalOffice.dmg

  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: packaging/build_windows.ps1   # unsigned; SmartScreen asks "Run anyway"
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/LocalOffice-Setup.exe

  release:
    if: github.event_name != 'pull_request'
    needs: [dmg, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Local Office ${TAG#v}" --generate-notes \
              $([[ "$TAG" == v0.* ]] && echo --prerelease)
          gh release upload "$TAG" assets/* --clobber
