[project]
name = "local-office"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "sqlite-vec>=0.1.6",
  "pypdfium2>=4.30",
  "pillow>=11",
  "pillow-heif>=0.21",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pywebview>=6.2",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.22"]

[tool.pytest.ini_options]
pythonpath = ["."]
