[project]
name = "local-office"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "sqlite-vec>=0.1.6; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "numpy>=2.1; sys_platform == 'win32' and platform_machine == 'ARM64'",
  "pypdfium2>=4.30",
  "pillow>=11",
  "pillow-heif>=0.21",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pywebview>=6.2",
  "pyyaml>=6.0.3",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
snapdragon = ["geniex==0.10.0", "onnxruntime>=1.30", "onnxruntime-qnn==2.7.0", "tokenizers>=0.21", "huggingface-hub>=0.30", "jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.22"]

[tool.pytest.ini_options]
pythonpath = ["."]
